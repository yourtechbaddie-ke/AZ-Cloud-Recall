
<meta name="theme-color" content="#04222C">
<meta name="description" content="AZ Cloud Recall — a focused, gamified AZ-900 study companion with flashcards, practice exams, service matching, notes and progress tracking.">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/icon.svg">
<title>AZ Cloud Recall</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@500;700;800&family=Pinyon+Script&family=Caveat:wght@500;700&family=Figtree:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout concept: a royal study desk. A teal side menu with a crowned rank card, a dotted blueprint paper canvas, bold Syne headlines with Pinyon Script flourishes, Caveat handwriting for notes, doodles drawn over everything, and one aurora hero. Palette: Deep Teal and Damson. */
:root{
  --paper:#EBF0EF; --surface:#FBFCFC; --soft:#E0E8E7; --ink:#0B2230; --muted:#4A626D;
  --line:#C9D6D6; --rule:#BCD8D5; --dots:#C3D3D2; --damson:#8E2457; --accent:#0A7C86; --accent-ink:#FFFFFF;
  --again:#C0344A; --hard:#A86400; --good:#2B8A3E; --easy:#3454D1; --shadow:rgba(11,34,48,.30);
  --hero-a:#04222C; --hero-b:#0A4A56; --hero-glow:#B02C6C; --hero-ink:#EAF8F6; --hero-mute:rgba(234,248,246,.76); --hero-big:#6FF0DC; --hero-btn-ink:#04222C;
  --side-a:#04222C; --side-b:#0A3F4B; --side-ink:#E4F6F3; --side-mute:rgba(228,246,243,.68);
  --note-ink:#1B2B36; --n-mint:#CBEEE8; --n-rose:#F2D2E1; --n-blue:#D2DBF7; --n-amber:#F6E3B8;
  --font-display:"Syne",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-script:"Pinyon Script","Snell Roundhand","Brush Script MT",cursive;
  --font-hand:"Caveat","Segoe Print","Bradley Hand",cursive;
  --font-body:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"DM Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#06141C; --surface:#0D2230; --soft:#12303F; --ink:#E3F1EF; --muted:#8DADB1;
  --line:#1C3B49; --rule:#1E4352; --dots:#15303C; --damson:#E0679F; --accent:#45D9C5; --accent-ink:#04222C;
  --again:#FF7D8E; --hard:#F2B24C; --good:#6FCB7C; --easy:#92A9FF; --shadow:rgba(0,0,0,.65);
  --hero-b:#0B5260; --hero-glow:#C23A7C; --side-a:#031A22; --side-b:#08323D;
  --note-ink:#EAF3F1; --n-mint:#0F3D3E; --n-rose:#44193000; --n-rose:#43192F; --n-blue:#1B2750; --n-amber:#43330F; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#06141C; --surface:#0D2230; --soft:#12303F; --ink:#E3F1EF; --muted:#8DADB1;
  --line:#1C3B49; --rule:#1E4352; --dots:#15303C; --damson:#E0679F; --accent:#45D9C5; --accent-ink:#04222C;
  --again:#FF7D8E; --hard:#F2B24C; --good:#6FCB7C; --easy:#92A9FF; --shadow:rgba(0,0,0,.65);
  --hero-b:#0B5260; --hero-glow:#C23A7C; --side-a:#031A22; --side-b:#08323D;
  --note-ink:#EAF3F1; --n-mint:#0F3D3E; --n-rose:#43192F; --n-blue:#1B2750; --n-amber:#43330F; color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font:400 16px/1.5 var(--font-body);
  background-image:radial-gradient(var(--dots) 1.1px,transparent 1.2px);background-size:22px 22px}
h1,h2,h3{font-family:var(--font-display);margin:0;line-height:1.1;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:1.25rem;font-weight:800}
h3{font-weight:700}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--font-mono)}
.script{font-family:var(--font-script);font-weight:400;letter-spacing:0;font-size:1.25em;line-height:1}
.hand{font-family:var(--font-hand);font-weight:700}
.dd{width:1.5em;height:auto;display:inline-block;vertical-align:middle;overflow:visible}
.dd *{vector-effect:non-scaling-stroke}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:272px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;align-self:start;height:100vh;height:100dvh;overflow-y:auto;display:flex;flex-direction:column;gap:18px;
  padding-block:20px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:18px;color:var(--side-ink);
  background:radial-gradient(120% 60% at 0 100%,rgba(176,44,108,.35) 0,transparent 60%),linear-gradient(170deg,var(--side-b),var(--side-a));
  border-right:1px solid rgba(255,255,255,.08)}
.brand{display:flex;align-items:center;gap:10px;color:var(--side-ink)}
.brand .crown{width:44px;color:var(--hero-big);flex:none;filter:drop-shadow(0 0 8px rgba(111,240,220,.45))}
.brand .az{font-family:var(--font-display);font-weight:800;font-size:1.65rem;letter-spacing:-.02em;line-height:1}
.brand .cr{display:block;font-family:var(--font-script);font-size:2rem;line-height:.8;color:#fff;text-shadow:0 0 10px rgba(111,240,220,.7),0 0 26px rgba(111,240,220,.35)}
.nav{display:grid;gap:3px}
.nv{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:.62rem .8rem;border:0;border-radius:12px;background:transparent;color:var(--side-mute);font-weight:600;cursor:pointer;position:relative;transition:background .15s,color .15s,transform .15s}
.nv:hover{background:rgba(255,255,255,.07);color:var(--side-ink);transform:translateX(3px)}
.nv svg{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nv[aria-current="page"]{background:rgba(111,240,220,.14);color:#fff;box-shadow:inset 3px 0 0 var(--hero-big)}
.nv .badge{margin-left:auto;font-family:var(--font-mono);font-size:.7rem;padding:.05rem .45rem;border-radius:99px;background:var(--hero-big);color:var(--hero-btn-ink);font-weight:500}
.nv .badge.live{background:var(--damson);color:#fff}
.rank{margin-top:auto;padding:14px;border-radius:16px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12)}
.rank .rk{font-family:var(--font-hand);font-size:1.6rem;line-height:1;color:#fff}
.rank .eyebrow{color:var(--side-mute)}
.crowns{display:flex;gap:2px;color:var(--hero-big);margin:6px 0 8px;min-height:18px}
.crowns .dd{width:18px}
.crowns .off{opacity:.25}
.xpbar{height:7px;border-radius:4px;background:rgba(255,255,255,.14);overflow:hidden}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--hero-big),var(--hero-glow));border-radius:4px}
.fine{font-size:.72rem;color:var(--side-mute);line-height:1.4}
.mbar{display:none}
.scrim{display:none}
.main{min-width:0}
.content{max-width:1040px;margin:0 auto;padding-block:26px 70px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}

@media (max-width:900px){
  .app{display:block}
  .side{position:fixed;inset:0 auto 0 0;width:min(86vw,310px);max-height:none;height:100%;z-index:40;transform:translateX(-105%);visibility:hidden;transition:transform .25s ease,visibility 0s .25s;box-shadow:12px 0 40px -10px var(--shadow);padding-top:calc(20px + env(safe-area-inset-top,0px))}
  .side[data-open="true"]{transform:none;visibility:visible;transition:transform .25s ease}
  .scrim[data-open="true"]{display:block;position:fixed;inset:0;z-index:30;background:rgba(2,12,18,.55)}
  .mbar{display:flex;align-items:center;gap:12px;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));background:var(--surface);border-bottom:1px solid var(--line)}
  .mbar .mb-title{font-family:var(--font-display);font-weight:800;font-size:1.05rem}
  .mbar .mb-title span{font-family:var(--font-script);font-weight:400;font-size:1.5em;margin-left:4px}
  .mbar .sync{margin-left:auto}
}
.mbtn{width:42px;height:42px;display:grid;place-items:center;border:1px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer}
.mbtn svg{width:22px;height:22px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--surface);z-index:50}

/* ---------- type and bits ---------- */
.eyebrow{font-family:var(--font-mono);font-size:.72rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
.sync{font-family:var(--font-mono);font-size:.7rem;color:var(--muted)}
.ph{display:flex;flex-direction:column;gap:6px;margin-bottom:22px}
.ph h1{font-size:clamp(1.9rem,5vw,2.9rem);font-weight:800}
.ph h1 .script{color:var(--accent);font-size:1.35em;margin-left:.1em}
.ph .sq{width:150px;color:var(--damson);margin-top:2px}
.ph p{color:var(--muted);max-width:56ch}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;min-height:2.6rem;padding:.5rem 1.05rem;border:1px solid var(--line);background:var(--surface);border-radius:12px;font-weight:600;cursor:pointer;text-align:center;transition:transform .12s,box-shadow .12s,border-color .12s}
.btn:hover{border-color:var(--muted);transform:translateY(-1px)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{box-shadow:0 8px 20px -8px var(--accent)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.danger{color:var(--again)}
.btn.sm{min-height:2.1rem;padding:.2rem .75rem;font-size:.88rem;border-radius:10px}
.btn.lg{min-height:3.2rem;font-size:1.05rem}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed;transform:none}
kbd{font-family:var(--font-mono);font-size:.72rem;border:1px solid currentColor;border-radius:4px;padding:0 .3rem;opacity:.75}
input[type=text],input[type=number],input[type=date],select,textarea{width:100%;padding:.6rem .75rem;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
textarea{resize:vertical;min-height:4.5rem}
label.l{display:block;font-family:var(--font-mono);font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:6px}
.check{display:inline-flex;align-items:center;gap:8px;font-size:.92rem;color:var(--muted);cursor:pointer}
.check input{width:1.05rem;height:1.05rem;accent-color:var(--accent)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:1.1rem 1.2rem}
.panel.hand-box{border-radius:255px 22px 225px 22px/22px 225px 22px 255px;border-width:1.5px}
.cap{font-size:.86rem;color:var(--muted);margin-top:8px}
.empty{padding:1.2rem 0;color:var(--muted)}
.sec{margin-top:34px}
.sec>h2{margin-bottom:12px;display:flex;align-items:center;gap:10px}
.sec>h2 .dd{color:var(--damson);width:1.3em}
.chip{display:inline-block;font-family:var(--font-mono);font-size:.66rem;text-transform:uppercase;letter-spacing:.06em;padding:.12rem .45rem;border:1px solid var(--line);border-radius:6px;color:var(--muted);white-space:nowrap}
.chip.due{color:var(--accent);border-color:currentColor}
.chip.leech{color:var(--again);border-color:currentColor}
.chip.dom{color:var(--damson);border-color:currentColor}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row input{flex:1 1 12rem;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bar{height:7px;background:var(--line);border-radius:4px;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--damson));border-radius:4px;transition:width .5s}
.bar.thin{height:5px;margin-top:8px}
.counts{display:flex;flex-wrap:wrap;gap:4px 14px;font-family:var(--font-mono);font-size:.76rem;color:var(--muted);margin-top:4px}
.facts{display:flex;flex-wrap:wrap;gap:14px 40px}
.fact b{display:block;font-family:var(--font-display);font-size:1.9rem;line-height:1.1;font-variant-numeric:tabular-nums}
.fact span{font-family:var(--font-mono);font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}

/* ---------- hero ---------- */
.hero2{position:relative;overflow:hidden;border-radius:26px;color:var(--hero-ink);padding:clamp(1.3rem,4vw,2.4rem);
  background:radial-gradient(60% 90% at 100% 100%,var(--hero-glow) 0,transparent 62%),radial-gradient(55% 80% at 0 0,var(--hero-b) 0,transparent 70%),var(--hero-a);
  box-shadow:0 30px 60px -40px var(--shadow)}
.hero2 .clouds{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.cl{fill:rgba(255,255,255,.07);animation:drift 46s ease-in-out infinite alternate}
.cl.c2{animation-duration:62s;animation-delay:-20s;fill:rgba(255,255,255,.05)}
.cl.c3{animation-duration:38s;animation-delay:-9s;fill:rgba(111,240,220,.08)}
@keyframes drift{from{transform:translateX(-40px)}to{transform:translateX(90px)}}
.hero-in{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px 36px;align-items:center}
.greet{font-family:var(--font-script);font-size:clamp(2.2rem,6vw,3.4rem);line-height:1;color:#fff;text-shadow:0 0 14px rgba(111,240,220,.75),0 0 40px rgba(111,240,220,.4)}
.hl{font-family:var(--font-display);font-weight:800;font-size:clamp(1.6rem,4.6vw,2.6rem);line-height:1.08;margin:.45rem 0 .6rem;text-wrap:balance}
.hl .num{position:relative;display:inline-block;color:var(--hero-big);padding:0 .2em}
.hl .num svg{position:absolute;inset:-18% -12%;width:124%;height:136%;color:#fff;opacity:.85;overflow:visible}
.hero2 .coach{color:var(--hero-mute);max-width:46ch}
.hero2 .eyebrow{color:var(--hero-mute)}
.hero-acts{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.hero2 .btn{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.28);color:var(--hero-ink)}
.hero2 .btn.primary{background:var(--hero-big);border-color:var(--hero-big);color:var(--hero-btn-ink)}
.hero2 .btn[disabled]{background:rgba(255,255,255,.12);color:var(--hero-mute)}
.hero2 :focus-visible{outline-color:var(--hero-big)}
.hero-side{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.hchip{font-family:var(--font-mono);font-size:.74rem;padding:.25rem .7rem;border-radius:99px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);color:var(--hero-ink)}
.ring{position:relative;flex:none}
.ring svg{width:100%;height:100%;display:block}
.rt{fill:none;stroke:var(--line)}
.rv{fill:none;stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .8s}
.hero2 .rt{stroke:rgba(255,255,255,.18)}
.hero2 .rv{stroke:var(--hero-big)}
.ring-t{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-t b{font-family:var(--font-display);font-size:1.6rem;line-height:1;font-variant-numeric:tabular-nums}
.ring-t span{font-family:var(--font-mono);font-size:.62rem;text-transform:uppercase;letter-spacing:.08em;opacity:.75}

.map{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.isle{position:relative;padding:1.1rem 1.1rem 1rem;border:1.5px solid var(--line);border-radius:255px 24px 225px 24px/24px 225px 24px 255px;background:var(--surface);display:flex;flex-direction:column;gap:10px;transition:transform .2s,border-color .2s}
.isle:hover{transform:translateY(-4px) rotate(-.4deg);border-color:var(--accent)}
.isle .wt{font-family:var(--font-display);font-weight:800;font-size:2.1rem;line-height:1;color:var(--accent)}
.isle .wt small{font-size:.9rem;color:var(--muted);font-weight:700;margin-left:2px}
.isle h3{font-size:1.05rem}
.isle .dd{position:absolute;top:10px;right:14px;width:2rem;color:var(--damson);opacity:.9}
.isle .row{margin-top:auto}

.tip{position:relative;padding:18px 18px 14px;max-width:34rem;background:var(--n-amber);color:var(--note-ink);transform:rotate(-1.4deg);border-radius:6px 6px 40px 6px;box-shadow:0 14px 24px -16px var(--shadow)}
.tip::before{content:"";position:absolute;top:-11px;left:50%;width:84px;height:24px;transform:translateX(-50%) rotate(2deg);background:rgba(142,36,87,.35);border-radius:3px}
.tip .hand{font-size:1.55rem;line-height:1.15}
.tip .dd{position:absolute;right:12px;bottom:8px;width:2.4rem;color:var(--damson)}
.duo{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:18px;align-items:start}

/* ---------- charts ---------- */
svg.chart{display:block;width:100%;height:auto}
.chart text{fill:var(--muted);font-family:var(--font-mono);font-size:13px}
.chart .axis,.chart .grid{stroke:var(--line);stroke-width:1;fill:none}
.chart .b-acc{fill:var(--accent)}
.chart .b-now{fill:var(--damson)}
.chart .b-ok{fill:var(--good)}
.chart .b-miss{fill:var(--again)}
.chart .curve-a{fill:none;stroke:var(--again);stroke-width:2;stroke-dasharray:6 5}
.chart .curve-b{fill:none;stroke:var(--accent);stroke-width:2.5}
.chart .dot{fill:var(--accent)}
.chart .pass{stroke:var(--damson);stroke-width:1.5;stroke-dasharray:5 5;fill:none}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:10px;font-size:.86rem;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:3px;overflow-x:auto;padding-bottom:4px}
.hc{width:16px;height:16px;border-radius:4px;background:var(--soft)}
.hc.fut{background:transparent}
.hc.today{outline:2px solid var(--damson);outline-offset:1px}

/* ---------- study ---------- */
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.dtile{position:relative;text-align:left;padding:1.1rem;border:1.5px solid var(--line);border-radius:18px;background:var(--surface);cursor:pointer;display:flex;flex-direction:column;gap:6px;transition:transform .18s,border-color .18s,box-shadow .18s}
.dtile:hover{transform:translateY(-4px) rotate(-.5deg);border-color:var(--accent);box-shadow:0 18px 30px -20px var(--shadow)}
.dtile[disabled]{opacity:.55;cursor:not-allowed;transform:none}
.dtile h3{font-size:1.05rem;overflow-wrap:anywhere}
.dtile .due{font-family:var(--font-display);font-weight:800;font-size:2.3rem;line-height:1;color:var(--accent)}
.dtile.all{background:linear-gradient(150deg,var(--hero-a),var(--hero-b));color:var(--hero-ink);border-color:transparent}
.dtile.all .due{color:var(--hero-big)}
.dtile.all .counts{color:var(--hero-mute)}
.dtile .dd{position:absolute;right:12px;top:12px;width:1.8rem;color:var(--damson)}
.dtile.all .dd{color:var(--hero-big)}

.s-top{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.s-prog{flex:1;display:flex;align-items:center;gap:12px;min-width:0}
.s-prog .bar{flex:1}
.flip{perspective:1400px;cursor:pointer}
.flip-in{display:grid;transition:transform .6s cubic-bezier(.3,.8,.3,1);transform-style:preserve-3d}
.flip.on .flip-in{transform:rotateY(180deg)}
.face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face.back{transform:rotateY(180deg)}
.index{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 1px 0 var(--line),0 24px 40px -26px var(--shadow);padding:0 clamp(16px,4vw,32px) 24px;min-height:17rem}
.index::before{content:"";position:absolute;left:0;right:0;top:2.5rem;height:2px;background:var(--damson)}
.index .spark{position:absolute;right:14px;bottom:12px;width:1.6rem;color:var(--accent);opacity:.8}
.index-head{height:2.5rem;display:flex;align-items:center;justify-content:space-between;gap:10px;font-family:var(--font-mono);font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.index-head span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

 {key:'cloud',name:'Cloud concepts (25-30%)',match:'Cloud concepts',rows:[
  ["Shared responsibility model?","The provider and the customer split security duties. The provider always owns the physical datacenter, hosts and network. The customer always owns their data, accounts and devices. Everything in between shifts with the service type."],
  ["Public vs private vs hybrid cloud?","Public: owned by a provider and shared hardware, reached over the internet. Private: used by one organization, often on-premises. Hybrid: a mix of both, with apps and data moving between them."],

 {key:'arch',name:'Azure architecture and services (35-40%)',match:'Azure architecture',rows:[
  ["What is an Azure region?","A geographic area that holds one or more datacenters connected by a low-latency network."],

  ["Name Azure application hosting options.","Virtual Machines, App Service, Container Instances, Azure Kubernetes Service, Azure Functions and Azure Virtual Desktop."],

      if(!d){d={id:uid(),key:p.key,name:p.name,example:true,cards:[]};S.decks.push(d)}

      }

      if(meta){try{await col.doc('meta').set(metaDoc())}catch(e){ok=false;dirtyMeta=true}}
      return ok;
    })();
  }
  chain.then(function(ok){
    flushing=false;setSync(col&&ready?(ok?'saved':'error'):'local');
    if(again){again=false;flush()}
  });
}

/* ---------- scheduling ---------- */
function schedule(c,g){
  var ease=c.ease,ivl=c.ivl,reps=c.reps,lapses=c.lapses,due;
  if(g===0){lapses++;reps=0;ivl=0;ease=Math.max(1.3,ease-0.2);due=Date.now()+10*60000}
  else{
    if(g===1){ivl=reps===0?1:Math.max(ivl+1,Math.round(ivl*1.2));ease=Math.max(1.3,ease-0.15)}
    else if(g===2){ivl=reps===0?2:reps===1?4:Math.max(ivl+1,Math.round(ivl*ease))}
    else{ivl=reps===0?4:Math.max(ivl+2,Math.round(ivl*ease*1.3));ease=ease+0.15}
    reps++;due=addDays(sod(),ivl);
  }
  return {ease:ease,ivl:ivl,reps:reps,lapses:lapses,due:due};
}
function dayRec(){var k=dkey();return S.days[k]||(S.days[k]={n:0,ok:0,newBy:{}})}
function newLeft(d){var r=S.days[dkey()];return Math.max(0,S.settings.newPerDay-((r&&r.newBy&&r.newBy[d.id])||0))}
function deckStats(d){
  var now=Date.now(),nw=0,due=0,mature=0,learned=0;
  d.cards.forEach(function(c){if(!c.seen)nw++;else{if(c.due<=now)due++;if(c.ivl>=21)mature++;if(c.ivl>=7)learned++}});
  return {total:d.cards.length,nw:nw,due:due,mature:mature,learned:learned,avail:Math.min(nw,newLeft(d))};
}
function scopeDecks(scope){return scope==='all'?S.decks:S.decks.filter(function(d){return d.id===scope})}
function todayCount(scope){return scopeDecks(scope).reduce(function(a,d){var s=deckStats(d);return a+s.due+s.avail},0)}
function buildQueue(scope){
  var now=Date.now(),due=[],fresh=[];
  scopeDecks(scope).forEach(function(d){
    var left=newLeft(d);
    d.cards.forEach(function(c){
      if(c.seen){if(c.due<=now)due.push(c)}
      else if(left>0){fresh.push(c);left--}
    });
  });
  due.sort(function(a,b){return a.due-b.due});
  return due.concat(fresh).map(function(c){return c.id});
}
function findCard(id){
  for(var i=0;i<S.decks.length;i++){var d=S.decks[i];for(var j=0;j<d.cards.length;j++)if(d.cards[j].id===id)return {d:d,c:d.cards[j]}}
  return null;
}
function forecast(n){
  var out=[],s0=sod(),i;for(i=0;i<n;i++)out.push(0);
  S.decks.forEach(function(d){d.cards.forEach(function(c){
    if(!c.seen)return;
    var k=Math.round((sod(c.due)-s0)/DAY);if(k<0)k=0;if(k<n)out[k]++;
  })});
  return out;
}
function streak(){
  var k=sod(),s=0;
  if(!(S.days[dkey(k)]&&S.days[dkey(k)].n))k=addDays(k,-1);
  while(S.days[dkey(k)]&&S.days[dkey(k)].n){s++;k=addDays(k,-1)}
  return s;
}
function recent(n){
  var out=[],t=sod(),i;
  for(i=n-1;i>=0;i--){var k=addDays(t,-i),r=S.days[dkey(k)]||{n:0,ok:0};out.push({t:k,n:r.n,ok:r.ok})}
  return out;
}
function leeches(){
  var out=[];
  S.decks.forEach(function(d){d.cards.forEach(function(c){if(c.lapses>=3)out.push({d:d,c:c})})});
  return out.sort(function(a,b){return b.c.lapses-a.c.lapses});
}
function totalReviews(){var n=0;Object.keys(S.days).forEach(function(k){n+=S.days[k].n||0});return n}
function dueLabel(c){
  if(!c.seen)return ['New',''];
  if(c.due<=Date.now())return ['Due','due'];
  var d=Math.round((sod(c.due)-sod())/DAY);
  return [d<=0?'Soon':d===1?'Tomorrow':'In '+fmtIvl(d),''];
}
function deckByKey(k){return S.decks.find(function(d){return d.key===k})}
function mastery(key){var d=deckByKey(key);if(!d||!d.cards.length)return null;var s=deckStats(d);return Math.round(s.learned/s.total*100)}
function recallWeek(){var n=0,ok=0;recent(7).forEach(function(r){n+=r.n;ok+=r.ok});return n>=10?ok/n:null}
function daysToExam(){
  var v=S.settings.examDate;if(!v)return null;
  var p=v.split('-');if(p.length!==3)return null;
  var t=new Date(+p[0],+p[1]-1,+p[2]).getTime();if(isNaN(t))return null;
  return Math.round((t-sod())/DAY);
}
function readiness(){
  if(!S.exams.length)return null;
  var last=S.exams.slice(-3),avg=last.reduce(function(a,e){return a+e.pct},0)/last.length,rc=recallWeek();
  return Math.round(rc===null?avg:avg*0.6+rc*100*0.4);
}
function coachMsg(){
  var total=S.decks.reduce(function(a,d){return a+d.cards.length},0);
  if(!total)return 'Add a few cards to begin. Keep each card to one fact, so a miss tells you exactly what to fix.';
  var cnt=todayCount('all'),lc=leeches().length,st=streak();
  var rc=recallWeek(),dte=daysToExam();
  if(dte!==null&&dte>=0&&dte<=7&&S.exams.length<2)return dte+' days to go. Take a full mock now so you can see which area needs the last push.';
  if(cnt===0){
    var f=forecast(8),nx=-1,i;for(i=1;i<8;i++)if(f[i]>0){nx=i;break}
    return 'You are caught up.'+(nx>0?' Next reviews are due '+(nx===1?'tomorrow':'in '+nx+' days')+'. Try a timed mock or a match round while you wait.':' Add new cards when you are ready.');
  }
  if(lc>0)return plural(lc,'card')+' keep slipping. Rewrite them shorter, or add a hook like a doodle or a rhyme.';
  if(rc!==null&&rc<0.75)return 'Recall was under 75% this week. Turn on typing your answer first and lower new cards per day.';
  if(!S.exams.length&&totalReviews()>=40)return 'You have studied a good chunk. Try a 10-question sprint to test it under a timer.';
  if(st>=3)return st+'-day streak. Short daily sessions beat one long cram.';
  return 'For each Azure service, say its one-line job out loud before you flip. The exam mostly asks you to match a need to the right service.';
}

function barChart(cols,labels,aria,emptyMsg){
  var W=560,H=170,L=8,R=8,T=22,B=26,n=cols.length,i,tot=cols.map(function(c){return c.reduce(function(a,s){return a+s.v},0)});
  var mx=Math.max(1,Math.max.apply(null,tot)),bw=(W-L-R)/n,gap=bw*0.3,w=bw-gap;
  var out='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(aria)+'">'+(Math.max.apply(null,tot)===0?'<text x="'+W/2+'" y="'+(H/2-14)+'" text-anchor="middle">'+esc(emptyMsg||'Nothing yet')+'</text>':'')+'<line class="axis" x1="'+L+'" y1="'+(H-B)+'" x2="'+(W-R)+'" y2="'+(H-B)+'"/>';
  for(i=0;i<n;i++){
    var x=L+i*bw+gap/2,y=H-B;
    cols[i].forEach(function(s){if(s.v<=0)return;var h=s.v/mx*(H-B-T);y-=h;out+='<rect class="'+s.cls+'" x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+w.toFixed(1)+'" height="'+h.toFixed(1)+'" rx="3"/>'});
    if(tot[i]>0)out+='<text x="'+(x+w/2).toFixed(1)+'" y="'+(y-6).toFixed(1)+'" text-anchor="middle">'+tot[i]+'</text>';
    out+='<text x="'+(x+w/2).toFixed(1)+'" y="'+(H-8)+'" text-anchor="middle">'+esc(labels[i])+'</text>';
  }
  return out+'</svg>';
}
function lineChart(vals,aria){
  var W=560,H=190,L=40,R=16,T=14,B=28,pw=W-L-R,ph=H-T-B,n=vals.length;
  function X(i){return L+(n===1?pw/2:i/(n-1)*pw)}
  function Y(p){return T+(1-p/100)*ph}
  var out='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(aria)+'">';
  [0,50,100].forEach(function(p){out+='<line class="grid" x1="'+L+'" y1="'+Y(p).toFixed(1)+'" x2="'+(W-R)+'" y2="'+Y(p).toFixed(1)+'"/><text x="'+(L-8)+'" y="'+(Y(p)+4).toFixed(1)+'" text-anchor="end">'+p+'%</text>'});
  out+='<line class="pass" x1="'+L+'" y1="'+Y(70).toFixed(1)+'" x2="'+(W-R)+'" y2="'+Y(70).toFixed(1)+'"/><text x="'+(W-R)+'" y="'+(Y(70)-6).toFixed(1)+'" text-anchor="end" style="fill:var(--damson)">70% pass line</text>';
  out+='<polyline class="ln" points="'+vals.map(function(v,i){return X(i).toFixed(1)+','+Y(v).toFixed(1)}).join(' ')+'"/>';
  vals.forEach(function(v,i){out+='<circle class="dot" cx="'+X(i).toFixed(1)+'" cy="'+Y(v).toFixed(1)+'" r="'+(i===n-1?6:4)+'"/>'});
  return out+'</svg>';
}
function curveSvg(){
  var W=560,H=220,L=44,R=16,T=14,B=32,pw=W-L-R,ph=H-T-B;
  function X(d){return L+d/30*pw}
  function Y(p){return T+(1-p)*ph}
  var rv=[0,1,3,8,19],a=[],b=[],d,i;
  for(d=0;d<=30;d+=0.25){
    a.push(X(d).toFixed(1)+','+Y(Math.exp(-d/2)).toFixed(1));
    var idx=0;rv.forEach(function(r,k){if(r<=d)idx=k});
    var s=2*Math.pow(2.4,idx);
    b.push(X(d).toFixed(1)+','+Y(Math.exp(-(d-rv[idx])/s)).toFixed(1));
  }
  var out='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Forgetting curve: memory fades quickly without review, and each spaced review slows the fade.">';
  [0,0.5,1].forEach(function(p){out+='<line class="grid" x1="'+L+'" y1="'+Y(p).toFixed(1)+'" x2="'+(W-R)+'" y2="'+Y(p).toFixed(1)+'"/><text x="'+(L-8)+'" y="'+(Y(p)+4).toFixed(1)+'" text-anchor="end">'+Math.round(p*100)+'%</text>'});
  for(i=0;i<=30;i+=5)out+='<text x="'+X(i).toFixed(1)+'" y="'+(H-10)+'" text-anchor="middle">'+i+'</text>';
  out+='<polyline class="curve-a" points="'+a.join(' ')+'"/><polyline class="curve-b" points="'+b.join(' ')+'"/>';
  rv.forEach(function(r){out+='<circle class="dot" cx="'+X(r).toFixed(1)+'" cy="'+Y(1).toFixed(1)+'" r="4"/>'});
  return out+'</svg>';
}

function pickQuestions(n,dom){
  var idx=QB.map(function(_,i){return i}),pool;
  if(dom!=='all'){pool=shuffle(idx.filter(function(i){return QB[i].d===dom}));return pool.slice(0,Math.min(n,pool.length))}
  var by={c:shuffle(idx.filter(function(i){return QB[i].d==='c'})),a:shuffle(idx.filter(function(i){return QB[i].d==='a'})),g:shuffle(idx.filter(function(i){return QB[i].d==='g'}))};
  var want={c:Math.round(n*DOMW.c),a:Math.round(n*DOMW.a)};want.g=n-want.c-want.a;
  var out=[];['c','a','g'].forEach(function(k){out=out.concat(by[k].splice(0,Math.min(want[k],by[k].length)))});
  if(out.length<n){var rest=shuffle(by.c.concat(by.a,by.g));out=out.concat(rest.slice(0,n-out.length))}
  return shuffle(out);
}
function startExam(cfg){

    return {i:i,opts:opts,pick:null,flag:false};
  });
  var ms=cfg.min*60000;
  exam={q:qs,cur:0,timed:cfg.timed,durMs:ms,t0:Date.now(),endAt:Date.now()+ms,done:false,res:null};
  S.settings.examTimed=cfg.timed;touchMeta();
  view.exConfirm=false;view.exFilter='all';view.page='exam';view.menu=false;window.scrollTo(0,0);render();
}
function finishExam(auto){
  if(!exam||exam.done)return;
  var secs=Math.round((Math.min(Date.now(),exam.timed?exam.endAt:Date.now())-exam.t0)/1000),correct=0,dom={c:[0,0],a:[0,0],g:[0,0]};
  exam.q.forEach(function(x){
    var q=QB[x.i],ok=x.pick!==null&&x.opts[x.pick].ok;
    dom[q.d][1]++;if(ok){correct++;dom[q.d][0]++}
  });
  var n=exam.q.length,pct=Math.round(correct/n*100);
  exam.done=true;exam.res={correct:correct,n:n,pct:pct,secs:secs,dom:dom,auto:!!auto};
  S.exams.push({t:Date.now(),n:n,correct:correct,pct:pct,secs:secs,dom:dom,timed:exam.timed});
  if(S.exams.length>30)S.exams=S.exams.slice(-30);
  addXp(10+Math.round(pct/5));
  award('m1');if(pct>=70)award('m70');if(pct===100)award('m100');
  if(pct>=70)burst();
  checkBadges();view.exConfirm=false;view.exFilter='all';touchMeta();render();
}

function newMatch(){

  match={pairs:pairs,L:shuffle([0,1,2,3,4,5]),R:shuffle([0,1,2,3,4,5]),done:{},selL:null,selR:null,bad:null,miss:0,t0:Date.now(),end:null,best:false};

function matchHtml(){
  if(!match)newMatch();
  var left=match.L.map(function(i){var cls=match.done[i]?' ok':(match.selL===i?' sel':'')+(match.bad&&match.bad.l===i?' bad':'');return '<button class="mc term'+cls+'" data-act="mpick" data-side="L" data-i="'+i+'"'+(match.done[i]?' disabled':'')+'>'+esc(match.pairs[i][0])+'</button>'}).join('');
  var right=match.R.map(function(i){var cls=match.done[i]?' ok':(match.selR===i?' sel':'')+(match.bad&&match.bad.r===i?' bad':'');return '<button class="mc'+cls+'" data-act="mpick" data-side="R" data-i="'+i+'"'+(match.done[i]?' disabled':'')+'>'+esc(match.pairs[i][1])+'</button>'}).join('');
  var n=Object.keys(match.done).length,fin=match.end!==null;
  var t=fin?match.end:(Date.now()-match.t0)+match.miss*3000;
  return pageHead('Service Match','Pair','up','Link each Azure service to the job it does. Wrong guesses add 3 seconds.')+
    '<div class="mhead"><span class="timer" id="timer">'+mmss(t)+'</span><span class="eyebrow">'+n+' of 6 matched · '+plural(match.miss,'miss')+(S.matchBest?' · best '+mmss(S.matchBest):'')+'</span><button class="btn sm" style="margin-left:auto" data-act="mnew">New round</button></div>'+
    (fin?'<div class="panel hand-box" style="margin-bottom:16px"><div class="verdict">Round complete</div><p style="margin-top:6px">Final time '+mmss(match.end)+(match.best?'. New personal best!':'.')+' +20 XP.</p><div class="row" style="margin-top:12px"><button class="btn primary" data-act="mnew">Play again</button></div></div>':'')+

function mpick(side,i){
  if(!match||match.end!==null||match.done[i]||match.bad)return;
  if(side==='L')match.selL=match.selL===i?null:i;else match.selR=match.selR===i?null:i;
  if(match.selL!==null&&match.selR!==null){
    if(match.selL===match.selR){
      match.done[match.selL]=true;match.selL=match.selR=null;
      if(Object.keys(match.done).length===6){
        match.end=(Date.now()-match.t0)+match.miss*3000;
        if(!S.matchBest||match.end<S.matchBest){S.matchBest=match.end;match.best=true}
        addXp(20);award('g1');checkBadges();burst();touchMeta();
      }
    }else{
      match.miss++;match.bad={l:match.selL,r:match.selR};match.selL=match.selR=null;
      setTimeout(function(){if(match){match.bad=null;if(view.page==='match')render()}},450);
    }
  }
  render();
}
function tickMatch(){
  if(view.page!=='match'||!match||match.end!==null)return;
  var t=document.getElementById('timer');if(t)t.textContent=mmss((Date.now()-match.t0)+match.miss*3000);
}

/* ---------- events ---------- */
function parseImport(text){
  var added=[],skipped=0;
  text.split(/\r?\n/).forEach(function(line){
    if(!line.trim())return;
    var i=line.indexOf('\t');if(i<0)i=line.indexOf('|');
    if(i<0){skipped++;return}
    var f=line.slice(0,i).trim(),b=line.slice(i+1).trim();
    if(!f||!b){skipped++;return}
    added.push(newCard(f,b));
  });
  return {added:added,skipped:skipped};
}
function curDeck(){return S.decks.find(function(d){return d.id===view.deckId})}
function examNav(i){if(!exam||exam.done)return;exam.cur=Math.max(0,Math.min(exam.q.length-1,i));view.exConfirm=false;render()}
function examPick(k){if(!exam||exam.done)return;var x=exam.q[exam.cur];if(k<0||k>=x.opts.length)return;x.pick=x.pick===k?null:k;render()}

app.addEventListener('change',function(e){
  var t=e.target;
  if(t.id==='deck-name'){var d=curDeck(),v=t.value.trim();if(d&&v&&v!==d.name){d.name=v;touchDeck(d.id)}else if(d)t.value=d.name}
  else if(t.id==='npd'){S.settings.newPerDay=+t.value;touchMeta()}
  else if(t.id==='dgoal'){S.settings.dailyGoal=+t.value;touchMeta()}
  else if(t.id==='edate'){S.settings.examDate=t.value;touchMeta()}
  else if(t.id==='tf-set'){S.settings.typeFirst=t.checked;touchMeta()}
  else if(t.id==='tf'&&sess){sess.typeFirst=t.checked;S.settings.typeFirst=t.checked;touchMeta();render()}
  else if(t.id==='ex-dom'){view.exCfg.dom=t.value}
  else if(t.id==='ex-timed'){view.exCfg.timed=t.checked}
  else if(t.hasAttribute&&t.hasAttribute('data-note')){var n=S.notes.find(function(x){return x.id===t.getAttribute('data-note')});if(n){n.text=t.value;touchMeta()}}
});
app.addEventListener('input',function(e){
  if(e.target.id==='deck-search'){
    view.q=e.target.value;view.limit=150;
    var d=curDeck(),box=document.getElementById('card-list');if(d&&box)box.innerHTML=listHtml(d);
  }
});
app.addEventListener('keydown',function(e){
  if(e.target.id==='cf-back'&&(e.ctrlKey||e.metaKey)&&e.key==='Enter'){e.preventDefault();var f=document.getElementById('card-form');if(f.requestSubmit)f.requestSubmit();else f.dispatchEvent(new Event('submit',{cancelable:true,bubbles:true}))}
});
document.addEventListener('keydown',function(e){
  var t=e.target,tag=t&&t.tagName;
  if(e.key==='Escape'&&view.menu){view.menu=false;render();return}
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  var typing=(tag==='INPUT'&&t.type!=='checkbox'&&t.type!=='radio')||tag==='TEXTAREA'||tag==='SELECT';
  if(view.page==='study'&&view.studying&&sess&&!sess.finished){
    if(t&&t.id==='ans'&&e.key==='Enter'){e.preventDefault();reveal();return}
    if(typing)return;
    if(tag==='BUTTON'&&(e.key===' '||e.key==='Enter'))return;
    if(!sess.shown&&(e.key===' '||e.key==='Enter')){e.preventDefault();reveal();return}
    if(sess.shown&&(e.key==='1'||e.key==='2'||e.key==='3'||e.key==='4')){grade(+e.key-1);return}
    if(e.key==='z'||e.key==='Z')undo();
  }else if(view.page==='exam'&&exam&&!exam.done){
    if(typing)return;
    var k='1234'.indexOf(e.key);if(k<0)k='abcd'.indexOf(e.key.toLowerCase());
    if(k>=0){examPick(k);return}
    if(e.key==='ArrowRight'){examNav(exam.cur+1);return}
    if(e.key==='ArrowLeft'){examNav(exam.cur-1);return}
    if(e.key==='f'||e.key==='F'){exam.q[exam.cur].flag=!exam.q[exam.cur].flag;render()}
  }else if(view.page==='home'&&(e.key==='s'||e.key==='S')&&!typing){
    if(todayCount('all')>0)startSession('all');
  }
});
function hashPage(){
  var h=(location.hash||'').replace('#','');
  if(PAGES.some(function(p){return p[0]===h})&&h!==view.page){view.page=h;return true}
  return false;
}
window.addEventListener('hashchange',function(){if(hashPage())render()});
setInterval(function(){tickExam();tickMatch()},500);

hashPage();
render();
checkBadges();
initStore();
})();
